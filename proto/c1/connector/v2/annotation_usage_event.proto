syntax = "proto3";

package c1.connector.v2;

import "validate/validate.proto";

option go_package = "github.com/conductorone/baton-sdk/pb/c1/connector/v2";

// UsageEventNetwork is the network origin of a UsageEvent's actor.
// Attach at most one to the annotations of an Event whose event is
// usage_event.
message UsageEventNetwork {
  string ip_address = 1 [(validate.rules).string = {
    ip: true
    ignore_empty: true
  }];
  // ISO 3166-1 alpha-2, e.g. "US".
  string country_code = 2 [(validate.rules).string = {
    len: 2
    ignore_empty: true
  }];
  // ISO 3166-2, e.g. "US-OR".
  string subdivision_code = 3 [(validate.rules).string = {
    max_bytes: 16
    ignore_empty: true
  }];
  // Autonomous system numbers the source attributes to ip_address.
  repeated uint32 asns = 4 [(validate.rules).repeated = {max_items: 64}];
}

// UsageEventOAuth is OAuth consent activity: the actor authorizes, revokes,
// is denied, or requests the target application's access to the actor's
// data. Attach at most one to the annotations of an Event whose event is
// usage_event.
message UsageEventOAuth {
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_AUTHORIZE = 1;
    ACTION_REVOKE = 2;
    ACTION_DENY = 3;
    ACTION_REQUEST = 4;
  }
  // ACTION_UNSPECIFIED when source_event_name maps to no Action.
  Action action = 1;
  string source_event_name = 2 [(validate.rules).string = {
    max_bytes: 256
    ignore_empty: true
  }];
  // Scopes the action applies to, as the source names them.
  repeated string scopes = 3 [(validate.rules).repeated = {
    max_items: 256
    items: {
      string: {
        min_bytes: 1
        max_bytes: 512
      }
    }
  }];
  // The source's client classification, as the source names it.
  string client_type = 4 [(validate.rules).string = {
    max_bytes: 256
    ignore_empty: true
  }];
}
