syntax = "proto3";

package c1.connector.v2;

option go_package = "github.com/conductorone/baton-sdk/pb/c1/connector/v2";

message ExternalTicketSettings {
  bool enabled = 1;
}

message ExternalTicketRef {
  string id = 1;
  string external_ticket_provisioner_config_id = 2;
}

// ListTicketSchemasPaged is attached to every response of a ListTicketSchemas task that
// requested paginate and was served in paged mode.
message ListTicketSchemasPaged {}
