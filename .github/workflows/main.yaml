name: main ci
on:
  push:
    branches:
      - main
jobs:
  buf-lint-and-breaking-change-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Breaking change detection against `main`
        uses: bufbuild/buf-action@v1
        with:
          version: '1.72.0'
          breaking: true
          format: false
          lint: true
          pr_comment: false
          push: false
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          skip-cache: true
          # Pinned. See ci.yaml note: a `latest` golangci-lint version
          # bump can retroactively break PRs and main when new rules
          # land. Update deliberately and fix new findings in the same PR.
          # v2.13.2 is also the floor for a go1.27 module; see ci.yaml.
          version: v2.13.2
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ubuntu-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        if: success()
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: go tests
        run: go test -tags=baton_lambda_support -v -covermode=count -json ./... > test.json
      - name: Print go test results
        if: always()
        run: cat test.json
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.9.0
        with:
          test-results: test.json
  windows-tests:
    name: Windows tests (shard ${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Verify shard omission detection
        if: matrix.shard == 0
        run: python -m unittest scripts/windows_test_shard_test.py
      - name: Run and audit native Windows tests
        run: python scripts/windows-test-shard.py --shard ${{ matrix.shard }} --count 4
      - name: Print go test results
        if: always()
        run: cat test.json
      - name: Annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.9.0
        with:
          test-results: test.json
      - name: Upload test timings and inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-tests-${{ matrix.shard }}
          path: |
            test.json
            test-shard.json
  windows-test-result:
    name: go-test (windows-latest)
    needs: windows-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Windows shard to pass
        env:
          RESULT: ${{ needs.windows-tests.result }}
        run: test "$RESULT" = success
