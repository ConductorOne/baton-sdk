name: main ci
on:
  push:
    branches:
      - main
jobs:
  buf-lint-and-breaking-change-detection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Breaking change detection against `main`
        uses: bufbuild/buf-action@v1
        with:
          version: '1.72.0'
          breaking: true
          format: false
          lint: true
          pr_comment: false
          push: false
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: Run linters
        uses: golangci/golangci-lint-action@v9
        with:
          skip-cache: true
          # Pinned. See ci.yaml note: a `latest` golangci-lint version
          # bump can retroactively break PRs and main when new rules
          # land. Update deliberately and fix new findings in the same PR.
          version: v2.12.2
          args: --timeout=3m
  go-test:
    strategy:
      matrix:
        platform: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install Go
        if: success()
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
      - name: go tests
        if: ${{ matrix.platform != 'windows-latest' }}
        run: go test -tags=baton_lambda_support,baton_lockchecks -v -covermode=count -json ./... > test.json
      - name: go tests
        if: ${{ matrix.platform == 'windows-latest' }}
        # Run tests with -short on Windows since its filesystem is very slow, causing CI to time out.
        #
        # bash, not the Windows default of pwsh: PowerShell treats an
        # unquoted comma as the array operator, so the comma-separated tag
        # list made this step fail in zero seconds without even creating
        # test.json, which then surfaced as a confusing "cat test.json"
        # failure two steps later. bash also keeps the two legs' quoting
        # rules identical, so a flag that works on one works on the other.
        shell: bash
        run: go test -timeout=30m -tags=baton_lambda_support,baton_lockchecks -short -v -covermode=count -json ./... > test.json
      - name: Print go test results
        if: always()
        run: cat test.json
      - name: annotate go tests
        if: always()
        uses: guyarb/golang-test-annotations@v0.9.0
        with:
          test-results: test.json
